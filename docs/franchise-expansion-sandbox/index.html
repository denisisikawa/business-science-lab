function renderRegions(){const regions=[...model.byRegion].sort((a,b)=>b.tam-a.tam),max=Math.max(1,...regions.map(x=>x.tam));$('regions').replaceChildren(...regions.map(r=>{const heat=el('span','heat',money(r.tam));heat.style.background='rgba(182,99,116,'+(.15+.65*r.tam/max)+')';return row([r.region,n(r.clients),pct(r.clients?r.covered/r.clients:0),heat,n(r.partners)])}))}
function move(id,stage){const p=data.partners.find(p=>p.id===id);if(!p||!stages.includes(stage))return;p.stage=stage;selected=id;render()}
function renderBoard(){const m=model;$('funnel').replaceChildren(...stages.slice(0,-1).map((s,i)=>{const ps=m.partners.filter(p=>p.stage===s),x=el('div');x.append(el('span','',t(s)),el('b','',n(ps.length)),el('span','',t('prob')+' '+probs[i]+'%'));return x}));$('board').replaceChildren(...stages.map(s=>{const lane=el('div','lane');const ps=m.partners.filter(p=>p.stage===s);const title=el('h3','',t(s));title.append(el('span','',n(ps.length)));lane.append(title);lane.ondragover=e=>{e.preventDefault();lane.classList.add('over')};lane.ondragleave=()=>lane.classList.remove('over');lane.ondrop=e=>{e.preventDefault();lane.classList.remove('over');move(e.dataTransfer.getData('text/plain'),s)};for(const p of ps){const card=el('article','lead'+(p.id===selected?' selected':''));card.draggable=true;card.ondragstart=e=>e.dataTransfer.setData('text/plain',p.id);const name=el('button','',p.name);name.onclick=()=>{selected=p.id;render();$('territory').scrollIntoView()};const dropdown=el('select');dropdown.setAttribute('aria-label',t('stage')+' '+p.name);fillOptions(dropdown,stages.map(k=>[k,t(k)]),s);dropdown.onchange=()=>move(p.id,dropdown.value);card.append(name,el('p','',p.region),el('p','',n(p.allocated)+' · '+t('assigned')),el('p','',money(p.weighted)+' · '+t('weighted')),dropdown);lane.append(card)}return lane}))}
function renderActions(active){$('actions').replaceChildren(...active.slice(0,12).map(p=>{const a=el('button','btn',p.name);a.onclick=()=>{selected=p.id;render();$('territory').scrollIntoView()};const tr=el('tr');const c=el('td');c.append(a);tr.append(c,el('td','',p.region),el('td','',t(p.stage)),el('td','num',p.score+'/100'),el('td','num',money(p.weighted)),el('td','',t('a'+p.stage)));return tr}))}
$('partner').onchange=()=>{selected=$('partner').value;render()};['radius','segment','penetration','share'].forEach(id=>$(id).onchange=render);$('reset').onclick=()=>{data=createScenario();selected=data.partners[0].id;render()};setLang(lang);
</script></body></html>

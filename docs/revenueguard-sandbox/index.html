ng{display:block;font-size:clamp(18px,2.05vw,28px);font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1.15;margin:9px 0 4px;overflow-wrap:anywhere}.metric small{font-size:10px;color:var(--muted)}.bad{color:var(--red)}.good{color:var(--mint)}.gold{color:var(--gold)}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}.insight{display:grid;grid-template-columns:30px 1fr;gap:11px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}.insight:last-child{border:0;padding-bottom:0}.insight h3{margin-bottom:5px}.insight p{font-size:12px;color:var(--muted)}.num{height:29px;width:29px;display:grid;place-items:center;border:1px solid #684556;background:#422836;border-radius:8px;color:var(--gold);font-size:11px;font-weight:700}.mixrow{display:grid;grid-template-columns:1fr auto;gap:5px;margin:16px 0}.mixrow span{font-size:12px;color:var(--muted)}.mixrow b{font-size:13px;font-variant-numeric:tabular-nums}.track{grid-column:1/-1;height:7px;background:#372a37;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;border-radius:8px}.viz{width:100%;display:block;height:auto}.viz text{fill:var(--muted);font-size:10px;font-family:system-ui}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--muted);margin:9px 0}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}.btn{border:1px solid #594052;background:#332432;color:var(--ink);border-radius:8px;padding:10px 13px;font-size:12px;font-weight:650;white-space:nowrap;min-height:39px}.primary{background:linear-gradient(135deg,#efc993,#c79760);color:#23151b;border-color:#e0b67b}.filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.filters label{flex:1;min-width:140px}label{font-size:11px;font-weight:650;color:var(--muted);display:block}input,select{display:block;width:100%;min-height:39px;background:#160f18;color:var(--ink);border:1px solid #503b4c;border-radius:8px;padding:9px 10px;margin-top:5px}.tablefr <script>
const SOURCE="\"\"\"Deterministic synthetic revenue assurance data; Python 3.10+, no dependencies.\"\"\"\nimport argparse\nimport csv\nimport json\nimport random\nfrom pathlib import Path\n\n\nPRODUCTS = [\n    (\"P001\", \"ERP license\", \"recurring\", 15000),\n    (\"P002\", \"Managed support\", \"recurring\", 500000),\n    (\"P003\", \"Cloud compute\", \"metered\", 2000),\n    (\"P004\", \"Analytics license\", \"recurring\", 30000),\n]\n\n\ndef generate(output: Path, customers: int = 100, months: int = 12, seed: int = 42, anomaly_rate: float = 0.035):\n    if customers \u003c 1 or not 1 \u003c= months \u003c= 120:\n        raise ValueError(\"customers must be positive; months must be 1..120\")\n    if not 0 \u003c= anomaly_rate \u003c= 1:\n        raise ValueError('anomaly_rate must be between 0 and 1')\n    scale = anomaly_rate / .035\n    rng = random.Random(seed)\n    output = Path(output)\n    output.mkdir(parents=True, exist_ok=True)\n    (output / \"evaluation\").mkdir(exist_ok=True)\n    periods = [f\"{2025 + i // 12:04d}-{i % 12 + 1:02d}\" for i in range(months)]\n    schemas = {\n        \"customers\": \"customer_id segment\",\n        \"products\": \"product_id name billing_model unit_price_cents\",\n        \"contracts\": \"contract_id customer_id start_period end_period\",\n        \"contract_items\": \"item_id contract_id product_id unit_price_cents quantity\",\n        \"service_usage\": \"item_id period delivered_quantity\",\n        \"invoice_items\": \"invoice_item_id item_id period billed_cents\",\n        \"journal_entries\": \"journal_id invoice_item_id period recognized_cents\",\n        \"evaluation/ground_truth\": \"anomaly_id item_id period defect expected_cents actual_cents exposure_cents\",\n    }\n    from contextlib import ExitStack\n    with ExitStack() as stack:\n        writers, counts = {}, dict.fromkeys(schemas, 0)\n        for name, schema in schemas.items():\n            stream = stack.enter_context((output / f\"{name}.csv\").open(\"w\", newline=\"\", encoding=\"utf-8\"))\n            writer = csv.writer(stream)\n            writer.writerow(schema.split())\n            writers[name] = writer\n\n        def emit(name, *values):\n            writers[name].writerow(values)\n            counts[name] += 1\n\n        for product in PRODUCTS:\n            emit(\"products\", *product)\n        for i in range(1, customers + 1):\n            customer_id, contract_id = f\"C{i:07d}\", f\"CT{i:07d}\"\n            segment = rng.choices([\"SMB\", \"Mid-market\", \"Enterprise\"], [60, 30, 10])[0]\n            emit(\"customers\", customer_id, segment)\n            emit(\"contracts\", contract_id, customer_id, periods[0], periods[-1])\n            for j, product in enumerate(rng.sample(PRODUCTS, 2), 1):\n                product_id, _, model, list_price = product\n                item_id = f\"{contract_id}-{j}\"\n                quantity = 1 if product_id == \"P002\" else rng.randint(5, {\"SMB\": 30, \"Mid-market\": 120, \"Enterprise\": 500}[segment])\n                price = list_price * rng.choice([85, 90, 95, 100]) // 100\n                emit(\"contract_items\", item_id, contract_id, product_id, price, quantity)\n                for period in periods:\n                    delivered = quantity if model == \"recurring\" else max(1, quantity * rng.randint(70, 140) // 100)\n                    emit(\"service_usage\", item_id, period, delivered)\n                    expected = price * delivered\n                    draw = rng.random()\n                    defect, actual = None, expected\n                    if draw \u003c .01 * scale:\n                        defect, actual = \"MISSING_BILLING\", 0\n                    elif draw \u003c .03 * scale:\n                        defect, actual = \"UNDERBILLING\", expected * 80 // 100\n                    elif draw \u003c .035 * scale:\n                        defect, actual = \"OVERBILLING\", expected * 125 // 100\n                    key = f\"{item_id}-{period}\"\n                    if defect != \"MISSING_BILLING\":\n                        emit(\"invoice_items\", f\"I-{key}\", item_id, period, actual)\n                        emit(\"journal_entries\", f\"J-{key}\", f\"I-{key}\", period, actual)\n                    if defect:\n                        emit(\"evaluation/ground_truth\", f\"A-{key}\", item_id, period, defect, expected, actual, expected - actual)\n    manifest = {\"version\": \"0.1\", \"seed\": seed, \"customers\": customers, \"months\": months, \"currency\": \"USD\", \"amount_unit\": \"cent\", \"anomaly_rate\": anomaly_rate, \"row_counts\": counts}\n    (output / \"manifest.json\").write_text(json.dumps(manifest, indent=2) + \"\\n\", encoding=\"utf-8\")\n    return manifest\n\n\nif __name__ == \"__main__\":\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--customers\", type=int, default=100)\n    parser.add_argument(\"--months\", type=int, default=12)\n    parser.add_argument(\"--seed\", type=int, default=42)\n    parser.add_argument(\"--output\", type=Path, default=Path(\"data/generated\"))\n    args = parser.parse_args()\n    print(json.dumps(generate(args.output, args.customers, args.months, args.seed), indent=2))\n";
const ENGINE="\"\"\"Shared deterministic sandbox engine. No AI or external services.\"\"\"\nimport csv\nimport tempfile\nfrom pathlib import Path\nfrom simulator import generate\n\ndef read(root, name):\n    with (root / (name + \".csv\")).open(newline=\"\", encoding=\"utf-8\") as f:\n        return list(csv.DictReader(f))\n\ndef reconcile(root):\n    items = {r[\"item_id\"]: r for r in read(root, \"contract_items\")}\n    products = {r[\"product_id\"]: r for r in read(root, \"products\")}\n    billed = {(r[\"item_id\"], r[\"period\"]): r for r in read(root, \"invoice_items\")}\n    rows, monthly = [], {}\n    total_expected, total_actual, under, over = 0, 0, 0, 0\n    for u in read(root, \"service_usage\"):\n        key = (u[\"item_id\"], u[\"period\"])\n        item = items[key[0]]\n        product = products[item[\"product_id\"]]\n        quantity = int(u[\"delivered_quantity\"]) if product[\"billing_model\"] == \"metered\" else int(item[\"quantity\"])\n        expected = quantity * int(item[\"unit_price_cents\"])\n        invoice = billed.get(key)\n        actual = int(invoice[\"billed_cents\"]) if invoice else 0\n        gap = expected - actual\n        total_expected += expected\n        total_actual += actual\n        under += max(0, gap)\n        over += max(0, -gap)\n        month = monthly.setdefault(key[1], {\"period\": key[1], \"expected\": 0, \"actual\": 0})\n        month[\"expected\"] += expected\n        month[\"actual\"] += actual\n        if gap:\n            rows.append({\"contract\": item[\"contract_id\"], \"item\": key[0], \"period\": key[1], \"product\": product[\"name\"], \"quantity\": quantity, \"unit_price\": int(item[\"unit_price_cents\"]), \"invoice\": invoice[\"invoice_item_id\"] if invoice else None, \"expected\": expected, \"actual\": actual, \"gap\": gap, \"defect\": \"MISSING_BILLING\" if not invoice else (\"UNDERBILLING\" if gap > 0 else \"OVERBILLING\")})\n    rows.sort(key=lambda r: abs(r[\"gap\"]), reverse=True)\n    return {\"expected\": total_expected, \"actual\": total_actual, \"under\": under, \"over\": over, \"events\": len(billed) + sum(r[\"invoice\"] is None for r in rows), \"rows\": rows, \"monthly\": list(monthly.values())}\n\ndef evaluate(root, rows):\n    # Isolated from detection; compare only after controls finish.\n    truth = {(r[\"item_id\"], r[\"period\"], r[\"defect\"]): int(r[\"exposure_cents\"]) for r in read(root, \"evaluation/ground_truth\")}\n    predictions = {(r[\"item\"], r[\"period\"], r[\"defect\"]): r[\"gap\"] for r in rows}\n    matched = truth.keys() & predictions.keys()\n    tp, fp, fn = len(matched), len(predictions)-len(matched), len(truth)-len(matched)\n    return {\"tp\": tp, \"fp\": fp, \"fn\": fn, \"precision\": tp/(tp+fp) if tp+fp else None, \"recall\": tp/(tp+fn) if tp+fn else None, \"amount_errors\": sum(truth[k] != predictions[k] for k in matched)}\n\ndef run_scenario(customers=1000, months=12, seed=42, anomaly_rate=.035):\n    if not 1 \u003c= customers \u003c= 10000 or not 1 \u003c= months \u003c= 12 or not 0 \u003c= anomaly_rate \u003c= .15:\n        raise ValueError(\"Sandbox limits: 1–10,000 customers; 1–12 months; 0–15% anomalies\")\n    with tempfile.TemporaryDirectory() as directory:\n        root = Path(directory)\n        manifest = generate(root, customers, months, seed, anomaly_rate)\n        result = reconcile(root)\n        result[\"benchmark\"] = evaluate(root, result[\"rows\"])\n        result[\"counts\"] = manifest[\"row_counts\"]\n        return result\n";

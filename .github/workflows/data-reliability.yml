name: Data Reliability
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  spark-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r databricks-pipeline-template/requirements-spark.txt
      - run: python -m pytest tests/test_pipeline_contract.py tests/test_pipeline_spark.py -q
        env:
          RUN_SPARK_TESTS: '1'

      - name: Validate engineering blueprint and negative cases
        run: |
          python databricks-pipeline-template/scripts/check_engineering_plan.py --plan databricks-pipeline-template/standards/example-plan.json
          python -m pytest tests/test_engineering_plan.py -q
